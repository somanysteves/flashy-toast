name: release

# Manual dispatch only — never auto-publish on tag push. The repo owner
# decides when (and whether) to cut a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.5.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - id: build
        shell: pwsh
        run: ./build.ps1

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ github.event.inputs.version }}" `
            "${{ steps.build.outputs.exe }}" `
            "install.ps1" `
            "uninstall.ps1" `
            --title "${{ github.event.inputs.version }}" `
            --draft `
            --generate-notes
